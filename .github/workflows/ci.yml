name: CI

on:
  push:
    branches: [rolling-release, main, master]
  pull_request:
    branches: [rolling-release, main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Needed for git operations in tests
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk xvfb
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov flake8 mypy
    
    - name: Lint with flake8
      run: |
        flake8 bmchat/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 bmchat/ tests/ --count --max-complexity=10 --max-line-length=120 --statistics
    
    - name: Type check with mypy
      run: |
        mypy --ignore-missing-imports bmchat/
    
    - name: Run tests with xvfb
      run: |
        xvfb-run -a python -m pytest tests/ -v --tb=short
    
    - name: Check code compiles
      run: |
        python -m py_compile bmchat/*.py
        python -m py_compile bmchat/*/*.py
    
    - name: Verify import works
      run: |
        python -c "import bmchat; print('Import OK')"

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install pip-audit
    
    - name: Security audit
      run: |
        pip-audit -r requirements.txt || true

  release:
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/rolling-release'
    timeout-minutes: 20
    # GITHUB_TOKEN precisa de contents:write para criar tag/release (403 sem isso com workflow permissions restritivas).
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Get version
      id: version
      run: |
        echo "VERSION=$(python -c "import bmchat.version; print(bmchat.version.get_version())")" >> $GITHUB_OUTPUT
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: steps.version.outputs.VERSION != ''
      with:
        tag_name: v${{ steps.version.outputs.VERSION }}
        name: Release ${{ steps.version.outputs.VERSION }}
        draft: false
        prerelease: false
        generate_release_notes: true